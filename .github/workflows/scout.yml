name: Scout Meta Scraper

# Scrapes public Meta (Facebook / Instagram / Threads) posts via Apify,
# transforms them into Scout's leads.json schema, and commits the result so
# the Scout app can fetch it from the raw endpoint.

on:
  # Scheduled auto-runs are PAUSED to stay within the Apify free tier ($5/mo).
  # With Threads batched into one run, a cycle costs ~$0.5-0.75 in credits.
  # Cadence guide (approx / month):
  #   Mon & Thu (below)  ~$4-4.6   weekly ~$2.2-3.2   (fit $5 free)
  #   Mon/Wed/Fri ~$7    daily ~$22 (need a paid Apify plan)
  # To resume, uncomment the schedule block. The 5-day window in config.json
  # matches this Mon/Thu cadence (max gap is 4 days), so every post is caught.
  # schedule:
  #   - cron: "0 8 * * 1,4" # Mondays & Thursdays 08:00 UTC (skips the weekend)
  workflow_dispatch: {} # manual "Run workflow" button (still works while paused)

permissions:
  contents: write

concurrency:
  group: scout-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Scrape Meta → build leads.json
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: npm run scrape

      - name: Validate leads.json
        run: npm run validate

      - name: Commit if changed
        run: |
          git config user.name "scout-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add leads.json
          if git diff --staged --quiet; then
            echo "No changes to leads.json."
          else
            git commit -m "chore: refresh Meta leads ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          fi
