name: Scout Meta Scraper

# Scrapes public Meta (Facebook / Instagram / Threads) posts via Apify,
# transforms them into Scout's leads.json schema, and commits the result so
# the Scout app can fetch it from the raw endpoint.

on:
  # Scheduled auto-runs are PAUSED to stay within the Apify free tier ($5/mo).
  # A full cycle (current config) costs ~$1.50 in Apify credits, so:
  #   weekly        ~$6.6/mo   every 10 days ~$4.6/mo   (near/under $5 free)
  #   2x/week ~$13   daily ~$46 (needs a paid Apify plan)
  # To resume, uncomment the schedule block. Pick a cadence you can afford;
  # weekly is a good near-free default. To go more often for free, first
  # trim the keyword lists / results in config.json (see README).
  # schedule:
  #   - cron: "0 8 * * 1" # weekly, Mondays 08:00 UTC
  workflow_dispatch: {} # manual "Run workflow" button (still works while paused)

permissions:
  contents: write

concurrency:
  group: scout-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Scrape Meta → build leads.json
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: npm run scrape

      - name: Validate leads.json
        run: npm run validate

      - name: Commit if changed
        run: |
          git config user.name "scout-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add leads.json
          if git diff --staged --quiet; then
            echo "No changes to leads.json."
          else
            git commit -m "chore: refresh Meta leads ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          fi
